# Local overrides for rootless Podman.
#
# - nginx deferred to "proxy" profile (API is directly on port 8000).
# - pg-maintenance deferred to "maintenance" profile (run manually if needed).
# - Both app containers use pre-built local images and the container-internal MinIO hostname.
services:
  rag-nginx:
    profiles: ["proxy"]

  pg-maintenance:
    profiles: ["maintenance"]

  rag-api:
    image: rag-api:local
    environment:
      - RAG_MINIO_ENDPOINT=rag-minio:9000

  rag-worker:
    image: rag-worker:local
    environment:
      - RAG_MINIO_ENDPOINT=rag-minio:9000
