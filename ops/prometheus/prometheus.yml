global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "rag-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["rag-api:8000"]

  # The vLLM fleet on the GPU host. Prometheus has no route to that host's
  # loopback, so it scrapes through the SSH tunnel container, which publishes
  # the fleet's ports inside this compose network: 18000 is chat, 18001 is
  # embeddings, matching the port numbering used everywhere else.
  - job_name: "vllm-chat"
    metrics_path: /metrics
    static_configs:
      - targets: ["rag-vllm-tunnel:18000"]
        labels: { instance_name: "chat", fleet: "gpu-host" }

  - job_name: "vllm-embed"
    metrics_path: /metrics
    static_configs:
      - targets: ["rag-vllm-tunnel:18001"]
        labels: { instance_name: "embed", fleet: "gpu-host" }

  # Per-instance GPU memory, which no vLLM instance can report: vLLM knows
  # about requests and its own KV pool, not about whose memory is on the card.
  # Served by the fleet's own vllm-gpu-exporter.service on the GPU host, and
  # reached over the SAME tunnel, on 18003 -> the fleet's 31702. The fleet
  # keeps its own service ports in a 31700-31769 band, clear of the crowded
  # 8000-20000 range and below the ephemeral floor (32768) so a fixed listener
  # cannot lose its port to an outgoing connection.
  #
  # No instance_name label here: this page carries one series PER INSTANCE and
  # labels them itself, so a job-level label would collide with them.
  - job_name: "vllm-gpu"
    metrics_path: /metrics
    static_configs:
      - targets: ["rag-vllm-tunnel:18003"]
        labels: { fleet: "gpu-host" }
